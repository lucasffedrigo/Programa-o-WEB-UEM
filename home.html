<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CineTrack - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="logo">CineTrack</h1>
    <div class="header-actions">
      <input type="text" class="input-search" placeholder="Buscar filme">
      <button class="btn-add">+ Adicionar</button>
    </div>
  </header>

  <nav aria-label="Filtros de status">
    <button>Todos</button>   
    <button>Assistido</button>
    <button>Assistindo</button>
    <button>Quero assistir</button> 
  </nav>

  <main>
  <!-- Card 1 -->
  <section class="card">
    <img src="TESTE.png" alt="A Origem" class="card-poster">
    <h2 class="card-title">A Origem</h2>
    <p class="card-meta">2010 · Ficção científica</p>
    <p class="card-rating">Nota: ★★★★★</p>
    <div class="card-footer">
      <span>assistido</span>
      <button>Editar</button>
      <button>Remover</button>
    </div>
  </section>

  <!-- Card 2 -->
  <section class="card">
    <img src="TESTE.png" alt="Parasita" class="card-poster">
    <h2 class="card-title">Parasita</h2>
    <p class="card-meta">2019 · Suspense</p>
    <p class="card-rating">Nota: ★★★★☆</p>
    <div class="card-footer">
      <span>assistido</span>
      <button>Editar</button>
      <button>Remover</button>
    </div>
  </section>

  <!-- Card 3 -->
  <section class="card">
    <img src="TESTE.png" alt="O Auto da Compadecida" class="card-poster">
    <h2 class="card-title">O Auto da Compadecida</h2>
    <p class="card-meta">2000 · Comédia</p>
    <p class="card-rating">Nota: ★★★★★</p>
    <div class="card-footer">
      <span>assistido</span>
      <button>Editar</button>
      <button>Remover</button>
    </div>
  </section>
</main>

  <footer>
    <small>CineTrack - UEM</small>
  </footer>

</body>
</html>
